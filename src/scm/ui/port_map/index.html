<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
body{margin:0;font:13px system-ui;color:#173047}#tools{display:flex;gap:8px;padding:8px;background:#f4f8fa}button{cursor:pointer;border:1px solid #a6b8c7;border-radius:4px;background:white;padding:5px 10px}svg{width:100%;height:410px;background:#eaf3f8;touch-action:none;border:1px solid #ccd8df}#tip{font-size:12px;padding:5px}.marker{cursor:pointer;pointer-events:bounding-box}#land{pointer-events:none}.marker:focus{outline:none;filter:drop-shadow(0 0 2px #0969da)}text{user-select:none;pointer-events:none}
</style><div id="tools"><button id="zoomIn" aria-label="地图放大">＋</button><button id="zoomOut" aria-label="地图缩小">−</button><button id="world">世界</button><button id="europe">欧洲</button><span>拖动平移 · 点击港口查看右侧详情</span></div><svg id="map" role="img" aria-label="12港口世界地图" viewBox="430 80 160 125"><g id="land"></g><g id="marks"></g></svg><div id="tip">内点：运营风险（灰=未知）；外环：覆盖（虚线=未验证/无源）。Natural Earth 公共领域底图；坐标为范围示意，非导航用途。</div>
<script>
const svg=document.getElementById('map'), ns='http://www.w3.org/2000/svg';let args={},geo=null,box=[430,80,160,125];
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function setBox(b){box=b;svg.setAttribute('viewBox',b.join(' '));drawMarkers()}
function xy(p){return [(p[0]+180)*1000/360,(90-p[1])*500/180]}
fetch('land.json').then(r=>r.json()).then(d=>{geo=d;let path='';d.features.forEach(f=>{let polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;polys.forEach(poly=>poly.forEach(r=>{path+='M'+r.map(xy).map(p=>p.join(',')).join('L')+'Z'}))});let el=document.createElementNS(ns,'path');el.setAttribute('d',path);el.setAttribute('fill','#ceded3');el.setAttribute('stroke','#92aa9b');el.setAttribute('stroke-width','.2');document.getElementById('land').append(el)});
function drawMarkers(){let g=document.getElementById('marks');g.replaceChildren();let k=Math.max(box[2]/svg.clientWidth,box[3]/svg.clientHeight);let count=0;(args.ports||[]).forEach((p,i)=>{let [x,y]=xy([p.longitude,p.latitude]); // offset labels/markers with connector lines for clustered business locations
let offsets={antwerp:[-13,0],rotterdam:[-9,-15],hamburg:[12,-4],bremerhaven:[-10,-24],teesport:[-35,-30],middlesbrough:[-35,-5],felixstowe:[-3,9],dover:[12,25], 'le-havre':[-15,20]};let [dx,dy]=offsets[p.id]||[10,0];dx*=k;dy*=k;let mx=x+dx,my=y+dy;
let line=document.createElementNS(ns,'line');Object.entries({x1:x,y1:y,x2:mx,y2:my,stroke:'#607686','stroke-width':.8*k}).forEach(([a,v])=>line.setAttribute(a,v));g.append(line);
let el=document.createElementNS(ns,'g');el.classList.add('marker');el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',p.business_label);el.dataset.portId=p.id;el.setAttribute('transform',`translate(${mx},${my})`);
let ring=document.createElementNS(ns,'circle');Object.entries({r:7*k,fill:'white',stroke:p.coverage_verified?'#16856c':'#758698','stroke-width':1.5*k,'stroke-dasharray':p.coverage_verified?'':`${2*k} ${2*k}`}).forEach(([a,v])=>ring.setAttribute(a,v));el.append(ring);
let dot=document.createElementNS(ns,'circle');dot.setAttribute('r',4*k);dot.setAttribute('fill',({high:'#cc3846',medium:'#c77e15',low:'#257b62'})[p.severity]||'#7b8794');el.append(dot);
let label=document.createElementNS(ns,'text');let left=['teesport','middlesbrough','felixstowe','le-havre','rotterdam','bremerhaven'].includes(p.id);label.setAttribute('x',mx+(left?-10:10)*k);label.setAttribute('text-anchor',left?'end':'start');label.setAttribute('y',my+4*k);label.setAttribute('font-size',12*k);label.setAttribute('fill','#173047');label.textContent=p.business_label;if(box[2]<400)g.append(label);
let title=document.createElementNS(ns,'title');title.textContent=`${p.business_label} · ${p.state||'unknown'} · ${p.coverage_label||'未验证'}`;el.append(title);
function choose(){send('streamlit:setComponentValue',{value:{port_id:p.id,click_id:Date.now()},dataType:'json'})}el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};g.append(el);count++});svg.dataset.markerCount=count}
addEventListener('message',e=>{if(e.data.type==='streamlit:render'){args=e.data.args;drawMarkers();send('streamlit:setFrameHeight',{height:480})}});
function zoom(n){let [x,y,w,h]=box;setBox([x+w*(1-n)/2,y+h*(1-n)/2,w*n,h*n])}document.getElementById('zoomIn').onclick=()=>zoom(.7);document.getElementById('zoomOut').onclick=()=>zoom(1.4);document.getElementById('world').onclick=()=>setBox([0,0,1000,500]);document.getElementById('europe').onclick=()=>setBox([430,80,160,125]);let drag;svg.onpointerdown=e=>{if(!e.target.closest('.marker')){drag={x:e.clientX,y:e.clientY,b:box.slice()};svg.setPointerCapture(e.pointerId)}};svg.onpointermove=e=>{if(drag)setBox([drag.b[0]-(e.clientX-drag.x)*drag.b[2]/svg.clientWidth,drag.b[1]-(e.clientY-drag.y)*drag.b[3]/svg.clientHeight,drag.b[2],drag.b[3]])};svg.onpointerup=()=>drag=null;
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:480});
</script></html>
