<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{width:100%;height:100%;margin:0;overflow:hidden}body{font:14px system-ui;color:#17384d}#map{background:#aad3df}.port-point{background:#116b65;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 7px #17384d88;box-sizing:border-box}.port-point:focus{outline:3px solid #e89e30;outline-offset:2px}.leaflet-popup-content{margin:16px;min-width:190px;line-height:1.55}.popup-title{font-size:17px;font-weight:700;margin-right:14px}.popup-line{margin-top:9px}.popup-muted{color:#607681;font-size:12px}.details{margin-top:13px;border:0;border-radius:6px;background:#116b65;color:white;padding:9px 15px;width:100%;font:inherit;cursor:pointer}.leaflet-control-zoom a,.world-button{font:20px system-ui!important;width:32px!important;height:32px!important;line-height:32px!important}.world-button{border:0;background:white;cursor:pointer}.leaflet-control-attribution{font-size:10px!important;max-width:85%}#fallback{position:absolute;z-index:1000;left:12px;top:12px;max-width:calc(100% - 70px);background:#fff7df;border:1px solid #e3c47c;border-radius:6px;padding:10px;box-shadow:0 2px 7px #17384d22;font-size:12px}#fallback[hidden]{display:none}.continent{font-size:13px;color:#445f62;background:none;border:0;box-shadow:none;text-align:center;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px white}.map-loading{position:absolute;z-index:900;top:12px;left:12px;background:#ffffffdd;padding:7px;border-radius:5px;font-size:12px}@media(max-width:500px){.leaflet-popup-content{min-width:165px;margin:12px;font-size:13px}.popup-title{font-size:16px}.leaflet-popup{max-width:290px}}
</style></head><body><div id="map" aria-label="交互式世界港口地图"></div><div id="loading" class="map-loading">正在加载底图…</div><div id="fallback" role="status" hidden></div><script src="leaflet.js"></script><script>
const root=document.getElementById('map');let args={},markers={},rendered=false,onlineLoaded=0,errors=0,fallbackLayer=null,fallbackActive=false;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
const map=L.map('map',{zoomControl:false,attributionControl:true,scrollWheelZoom:true,touchZoom:true,dragging:true,zoomSnap:.25,minZoom:1,maxZoom:18,worldCopyJump:false});
window.escimMap=map;
const names=L.layerGroup();for(const [title,lat,lng] of [['欧洲',64,28],['亚洲',43,100],['非洲',7,20],['北美洲',44,-105],['南美洲',-16,-60],['大洋洲',-25,135]])L.marker([lat,lng],{interactive:false,keyboard:false,zIndexOffset:-1000,icon:L.divIcon({className:'continent',html:title,iconSize:[60,20]})}).addTo(names);map.on('zoomend',()=>{if(map.getZoom()<=3||fallbackActive)names.addTo(map);else names.remove()});
 // Read-only acceptance observations use the actual Leaflet instance.
L.control.zoom({position:'bottomright',zoomInTitle:'放大',zoomOutTitle:'缩小'}).addTo(map);
const World=L.Control.extend({options:{position:'bottomright'},onAdd(){let b=L.DomUtil.create('button','world-button leaflet-bar');b.type='button';b.title='恢复世界视图';b.setAttribute('aria-label','恢复世界视图');b.textContent='◎';L.DomEvent.disableClickPropagation(b);L.DomEvent.on(b,'click',()=>{map.closePopup();map.fitWorld({animate:false})});return b}});new World().addTo(map);
const tile=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,noWrap:false,updateWhenIdle:true,updateWhenZooming:false,keepBuffer:0,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'});
async function fallback(reason){if(fallbackActive)return;fallbackActive=true;tile.remove();document.getElementById('loading').hidden=true;const banner=document.getElementById('fallback');banner.hidden=false;banner.textContent='在线底图不可用，正在加载离线基础底图…';try{const response=await fetch('land.json');if(!response.ok)throw Error('offline geometry unavailable');const geo=await response.json();let i=0;fallbackLayer=L.geoJSON(geo,{interactive:false,style:()=>({color:'#91a89c',weight:.7,fillColor:['#d4e6cf','#e9e6c8','#d9e4cc','#dce8d5','#e7dfc7'][i++%5],fillOpacity:1})}).addTo(map);map.attributionControl.addAttribution('Natural Earth · public domain');banner.textContent='在线底图不可用 · 已切换离线基础底图（国界/洲名；无街道细节）';root.dataset.basemap='offline';root.dataset.failure=reason}catch(e){banner.textContent='底图不可用：在线瓦片及离线文件均未加载。港口标点可操作，请稍后检查连接。';root.dataset.basemap='unavailable'}}
tile.on('loading',()=>root.dataset.tilesReady='false');tile.on('load',()=>root.dataset.tilesReady='true');tile.on('tileload',()=>{if(fallbackActive)return;onlineLoaded++;root.dataset.loadedTiles=onlineLoaded;root.dataset.basemap='online';document.getElementById('loading').hidden=true});tile.on('tileerror',()=>{if(++errors>=1)fallback('tile errors')});tile.addTo(map);setTimeout(()=>{if(!onlineLoaded)fallback('no loaded tiles within 8s')},8000);
function expose(){const c=map.getCenter();root.dataset.zoom=map.getZoom();root.dataset.center=JSON.stringify([c.lat,c.lng]);root.dataset.popup=map._popup&&map._popup.isOpen()?'open':'closed'}map.on('moveend zoomend popupopen popupclose',expose);
function text(tag,content,cls){let e=document.createElement(tag);e.textContent=content;if(cls)e.className=cls;return e}
function popup(p){let card=document.createElement('section');card.dataset.portId=p.id;card.setAttribute('aria-label',p.name_zh+'港口信息');card.append(text('div',p.name+' · '+p.name_zh,'popup-title'));card.append(text('div',({'Germany':'德国','Belgium':'比利时','Netherlands':'荷兰','UK':'英国','France':'法国','Slovenia':'斯洛文尼亚','Greece':'希腊','Morocco':'摩洛哥'})[p.country]||p.country,'popup-muted'));card.append(text('div','当前运营状态：'+p.status,'popup-line'));card.append(text('div',p.notice||'暂无有效运营公告','popup-line'));card.append(text('div','最近核实：'+p.verified,'popup-line popup-muted'));let b=text('button','查看详情','details');b.type='button';b.onclick=()=>{map.stop();let c=map.getCenter();send('streamlit:setComponentValue',{value:{action:'details',port_id:p.id,view:{center:[c.lat,c.lng],zoom:map.getZoom()},event_id:Date.now()},dataType:'json'})};card.append(b);return card}
addEventListener('message',event=>{if(event.data.type!=='streamlit:render')return;const previous=args.namespace;args=event.data.args;let height=Math.max(420,window.parent.innerHeight-100);document.body.style.height=height+'px';send('streamlit:setFrameHeight',{height});map.invalidateSize({pan:false});if(!rendered){if(args.view)map.setView(args.view.center,args.view.zoom,{animate:false});else map.fitWorld({animate:false});rendered=true}else if(previous!==args.namespace)map.closePopup();Object.values(markers).forEach(m=>m.remove());markers={};for(const p of args.ports||[]){let icon=L.divIcon({className:'port-point',iconSize:[18,18],iconAnchor:[9,9]});let m=L.marker([p.latitude,p.longitude],{icon,keyboard:true,title:p.name,alt:p.name_zh,bubblingMouseEvents:false}).addTo(map);m.getElement().dataset.portId=p.id;m.getElement().setAttribute('aria-label',p.name);m.getElement().addEventListener('focus',()=>{map.stop();map.panInside(m.getLatLng(),{paddingTopLeft:[40,40],paddingBottomRight:[65,90],animate:false})});m.bindPopup(()=>popup(p),{maxWidth:280,closeButton:true,autoPan:true,keepInView:true});markers[p.id]=m}root.dataset.markerCount=Object.keys(markers).length;map.attributionControl.setPrefix('Leaflet · '+String(args.namespace||'').toUpperCase());expose()});
map.on('click',()=>map.closePopup());window.addEventListener('resize',()=>{let height=Math.max(420,window.parent.innerHeight-100);document.body.style.height=height+'px';send('streamlit:setFrameHeight',{height});map.invalidateSize({pan:false})});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:700});
</script></body></html>
