[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-risk-monitor"
version = "0.1.0"
description = "Evidence-first supply chain intelligence and ETA risk monitor"
requires-python = ">=3.12,<3.13"
dependencies = ["streamlit>=1.44,<2", "SQLAlchemy>=2.0,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1", "feedparser>=6.0,<7", "beautifulsoup4>=4.13,<5", "alembic>=1.15,<2", "APScheduler>=3.11,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
scm = "scm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
